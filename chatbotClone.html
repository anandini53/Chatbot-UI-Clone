<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Clone</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        #main{
            display: none;
            box-shadow: 1px 1px 1px 5px  rgb(82, 180, 180);
            height: 400px;
            width: 250px;
            margin: 10px auto;
            border-radius: 20px;
            background-color:lightcyan;
        }
        #head{
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            background-color: rgb(92, 184, 184);
            width: 250px;
            height: 60px;
            text-align: center;
            align-content: center;
            font-size: 20px;    
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;    
            font-weight: bold;
        }
        #head button{
            margin-left: 30px;
            margin-right: 2px ;
            border: none;
            background-color: rgb(92, 184, 184);
            color: rgba(255, 0, 0, 0.705);
            font-size: 20px;
        }
        #head button:hover{
            color: rgb(226, 152, 152);
        }
        #inputMsg {
            position: fixed;
            bottom: 240px;
            padding-left: 10px;
        }
        #inputMsg input{
            width: 180px;
            height: 25px;
            border-radius: 20px;
            border: 2px solid black;
            background-color: white;
            border-radius: 20px;
            padding-left: 10px;
            
        }
        #inputMsg button{
            width: 38px;
            height: 30px;
            border-radius: 50px;
            background-color: rgb(81, 169, 219);
            color: white;
            border: none;
            font-size: 16px;
        }
        #msg1{
            background-color: rgb(192, 192, 228);
            width: 50px;
            height: 30px;
            align-content: center;
            margin-top: 20px;
            margin-left: 10px;
            padding-left: 10px;
            border-radius: 20px;
        }
        #msg2{
            background-color: pink;
            width: 150px;
            height: 30px;
            align-content: center;
            margin-top: 10px;
            margin-left: 10px;
            padding-left: 10px;
            border-radius: 20px;
        }
        #btn{
            background-color: rgb(92, 184, 184);
            color: white;
            border-radius: 30%;
            height: 60px;
            font-size: 40px;
            border: none;
            position: fixed;
            right: 450px;
            bottom: 250px;
        }
        #btn:hover{
            background-color: rgb(149, 199, 199);
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="head">
            <i class="fa-solid fa-robot"></i>
            AI CHATBOT
            <button id="closebtn" onclick="hideChatBot()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="msg1">
            Hello
        </div>
        
        <div id="msg2">
            How can I help you?
        </div>

        <div id="inputMsg">
            <input type="text" placeholder="Type Something...."/>
            <button><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>


    
    <button id="btn" onclick="showChatBox()"><i class="fa-regular fa-comment"></i></button>

    <script>

        let chatBox = document.getElementById('main');

        function showChatBox(){
            

            if(chatBox.style.display == "none"){
                chatBox.style.display = "block"
            }
            else{
                chatBox.style.display = "none"
            }
        }
        function hideChatBot(){

            if(chatBox.style.display == 'block'){
                chatBox.style.display = 'none';
            }
        }
    </script>
</body>
</html>
